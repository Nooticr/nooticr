[package]
name = "orchy"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
clap = "4.5.41"
derive = "1.0.0"
dirs = "5.0.1"
features = "0.10.0"
hmac = "0.12.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.47.0", features = ["full"] }
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
ratatui = "0.28"
crossterm = "0.28"
regex = "1.10"

[dev-dependencies]
tempfile = "3.20.0"
