[package]
name = "orchy"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
clap = "4.5.41"
derive = "1.0.0"
dirs = "5.0.1"
dotenv = "0.15.0"
features = "0.10.0"
hmac = "0.12.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1.47.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1.17.0", features = ["v4", "serde"] }
tempfile = "3.20.0"
ratatui = "0.28"
crossterm = "0.28"
regex = "1.10"
async-recursion = "1.1.1"
rusqlite = { version = "0.37.0", features = ["bundled"] }
tokio-retry = "0.3"

[dev-dependencies]
tempfile = "3.20.0"

[[bin]]
name = "verify_file_creation"
path = "verify_file_creation.rs"

[[bin]]
name = "debug_vue_generation"
path = "debug_vue_generation.rs"

[[bin]]
name = "e2e_prompt_calibration"
path = "src/bin/e2e_prompt_calibration.rs"
